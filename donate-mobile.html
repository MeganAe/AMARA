<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AMARA - Mobile Donation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary": "#ffffff",
                        "on-background": "#191c1e",
                        "surface": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "secondary": "#006c4a",
                        "on-error-container": "#93000a",
                        "tertiary": "#08192c",
                        "tertiary-container": "#1e2e42",
                        "primary-fixed": "#d8e2ff",
                        "primary-container": "#0f2c59",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#68dba9",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#85f8c4",
                        "surface-container": "#eceef0",
                        "surface-variant": "#e0e3e5",
                        "on-surface-variant": "#44474f",
                        "inverse-primary": "#aec7fd",
                        "primary": "#00173b",
                        "outline": "#747780",
                        "error-container": "#ffdad6",
                        "on-surface": "#191c1e",
                        "on-secondary-container": "#00714e",
                        "on-primary-fixed": "#001a41",
                        "surface-bright": "#f7f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "surface-dim": "#d8dadc",
                        "on-tertiary-fixed-variant": "#38485d",
                        "outline-variant": "#c4c6d0",
                        "on-primary-fixed-variant": "#2d4674",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "secondary-container": "#82f5c1",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-fixed": "#0b1c30",
                        "surface-tint": "#465e8e",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "primary-fixed-dim": "#aec7fd",
                        "tertiary-fixed": "#d3e4fe",
                        "background": "#f7f9fb",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-container": "#8596ae",
                        "on-secondary-fixed-variant": "#005137",
                        "on-secondary-fixed": "#002114",
                        "on-primary-container": "#7c94c8"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "sidebar-width": "280px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "margin-desktop": "40px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px"
                    },
                    fontFamily: {
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"],
                        "headline-xl": ["Playfair Display"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-md": ["28px", { lineHeight: "1.3", fontWeight: "600" }],
                        "headline-lg": ["36px", { lineHeight: "1.2", fontWeight: "700" }],
                        "label-md": ["14px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "600" }],
                        "headline-lg-mobile": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
                        "headline-sm": ["22px", { lineHeight: "1.4", fontWeight: "600" }],
                        "headline-xl": ["48px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }]
                    }
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes fadeStep {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-step {
            animation: fadeStep 0.4s ease-out forwards;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-secondary-container selection:text-on-secondary-container">
    <!-- TopNavBar (Mobile Simplified - No shell links, just brand and back/close) -->
    <header class="bg-surface shadow-sm sticky top-0 z-50">
        <div class="flex justify-between items-center px-margin-mobile w-full h-14 max-w-container-max mx-auto">
            <a class="flex items-center gap-2" href="#">
                <span aria-hidden="true" class="material-symbols-outlined text-primary text-xl"
                    data-icon="arrow_back">arrow_back</span>
            </a>
            <div class="font-headline-sm text-headline-sm font-bold text-primary">AMARA</div>
            <div class="w-8"></div> <!-- Spacer for centering -->
        </div>
    </header>
    <main class="flex-grow flex flex-col px-margin-mobile py-stack-md max-w-md mx-auto w-full">
        <div class="mb-stack-md text-center">
            <h1 class="font-headline-md text-headline-md text-primary mb-2">Make an Impact</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Your contribution empowers global initiatives.
            </p>
        </div>
        <!-- Step 1: Amount -->
        <div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,44,89,0.05)] p-4 border-l-4 border-secondary transition-all duration-300 ease-in-out"
            id="step-1">
            <h2 class="font-label-md text-label-md text-primary mb-3 uppercase tracking-wider">Select Amount</h2>
            <div class="flex bg-surface-container-low rounded-lg p-1 mb-4">
                <button
                    class="flex-1 py-1.5 font-label-md text-label-md rounded bg-surface-container-lowest shadow-sm text-primary transition-colors"
                    type="button">One-Time</button>
                <button
                    class="flex-1 py-1.5 font-label-md text-label-md rounded text-on-surface-variant hover:text-primary transition-colors"
                    type="button">Monthly</button>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button
                    class="py-2.5 border border-outline-variant rounded-lg font-body-md text-body-md text-primary hover:border-primary transition-colors"
                    type="button">$50</button>
                <button
                    class="py-2.5 border-2 border-primary rounded-lg font-body-md text-body-md text-primary bg-primary-fixed transition-colors"
                    type="button">$100</button>
                <button
                    class="py-2.5 border border-outline-variant rounded-lg font-body-md text-body-md text-primary hover:border-primary transition-colors"
                    type="button">$250</button>
                <button
                    class="py-2.5 border border-outline-variant rounded-lg font-body-md text-body-md text-primary hover:border-primary transition-colors"
                    type="button">$500</button>
            </div>
            <div class="mb-stack-md">
                <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="custom-amount">Custom
                    Amount</label>
                <div class="relative">
                    <span
                        class="absolute inset-y-0 left-0 pl-3 flex items-center text-on-surface-variant font-body-md text-body-md">$</span>
                    <input
                        class="block w-full pl-8 pr-3 py-2.5 border border-outline-variant rounded-lg font-body-md text-body-md text-primary focus:ring-2 focus:ring-primary focus:border-primary bg-surface-container-lowest"
                        id="custom-amount" placeholder="0.00" type="number" />
                </div>
            </div>
            <button
                class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-3 rounded-full flex justify-center items-center gap-2 hover:bg-secondary-fixed hover:text-on-secondary-fixed transition-colors"
                onclick="document.getElementById('step-1').classList.add('hidden'); document.getElementById('step-2').classList.remove('hidden'); document.getElementById('step-2').classList.add('animate-step');"
                type="button">
                Continue to Details
                <span aria-hidden="true" class="material-symbols-outlined text-base"
                    data-icon="arrow_forward">arrow_forward</span>
            </button>
        </div>
        <!-- Step 2: Details (Initially Hidden) -->
        <div class="hidden bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(15,44,89,0.05)] p-4 border-l-4 border-secondary transition-all duration-300 ease-in-out"
            id="step-2">
            <div class="flex items-center gap-3 mb-4">
                <button class="text-primary p-1 hover:bg-surface-container-low rounded-full transition-colors"
                    onclick="document.getElementById('step-2').classList.add('hidden'); document.getElementById('step-2').classList.remove('animate-step'); document.getElementById('step-1').classList.remove('hidden'); document.getElementById('step-1').classList.add('animate-step');"
                    type="button">
                    <span aria-hidden="true" class="material-symbols-outlined text-xl"
                        data-icon="arrow_back">arrow_back</span>
                </button>
                <h2 class="font-label-md text-label-md text-primary uppercase tracking-wider">Your Details</h2>
            </div>
            <div class="space-y-4 mb-stack-md">
                <div>
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="full-name">Full
                        Name</label>
                    <input
                        class="block w-full px-3 py-2.5 border border-outline-variant rounded-lg font-body-md text-body-md text-primary focus:ring-2 focus:ring-primary focus:border-primary bg-surface-container-lowest"
                        id="full-name" placeholder="Jane Doe" type="text" />
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email
                        Address</label>
                    <input
                        class="block w-full px-3 py-2.5 border border-outline-variant rounded-lg font-body-md text-body-md text-primary focus:ring-2 focus:ring-primary focus:border-primary bg-surface-container-lowest"
                        id="email" placeholder="jane@example.com" type="email" />
                </div>
                <div>
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="card">Card
                        Information</label>
                    <div
                        class="border border-outline-variant rounded-lg bg-surface-container-lowest p-2.5 flex items-center gap-2">
                        <span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant text-xl"
                            data-icon="credit_card">credit_card</span>
                        <input class="block w-full border-none p-0 focus:ring-0 font-body-md text-body-md text-primary"
                            id="card" placeholder="•••• •••• •••• ••••" type="text" />
                    </div>
                </div>
            </div>
            <button
                class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-3 rounded-full flex justify-center items-center gap-2 hover:bg-secondary-fixed hover:text-on-secondary-fixed transition-colors shadow-sm"
                type="button">
                <span aria-hidden="true" class="material-symbols-outlined text-base" data-icon="lock">lock</span>
                Donate $100 Securely
            </button>
            <p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-3 text-xs">By donating, you agree
                to our Terms of Service.</p>
        </div>
    </main>
    <!-- Footer (Simplified for mobile transactional page) -->
    <footer class="bg-primary py-4 px-margin-mobile mt-auto">
        <div class="flex flex-col items-center justify-center text-center">
            <div class="font-headline-sm text-lg text-on-primary mb-1">AMARA</div>
            <p class="font-body-sm text-xs text-on-primary-container">© 2026 AMARA Institutional. Secure Donation.</p>
        </div>
    </footer>
</body>

</html>
