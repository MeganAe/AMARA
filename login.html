  <body
    class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center px-margin-mobile"
  >
    <div
      class="w-full max-w-md bg-white rounded-[16px] shadow-level-2 p-stack-lg"
    >
      <a href="index.html" class="flex items-center gap-3 mb-8">
        <span class="font-headline-sm text-headline-sm text-primary"
          >AMORA</span
        >
      </a>
      <h1 class="font-headline-md text-headline-md text-primary mb-2">
        Connexion
      </h1>
      <p class="font-body-md text-body-md text-on-surface-variant mb-8">
        Accédez à votre espace donateur ou administrateur.
      </p>
      <div class="flex flex-col gap-stack-md">
        <div>
          <label class="font-label-md text-label-md text-primary block mb-1"
            >Email</label
          >
          <input
            id="loginEmail"
            type="email"
            placeholder="vous@email.com"
            class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none"
          />
        </div>
        <div>
          <label class="font-label-md text-label-md text-primary block mb-1"
            >Mot de passe</label
          >
          <input
            id="loginPass"
            type="password"
            placeholder="••••••••"
            class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none"
          />
        </div>
        <button
          onclick="doLogin()"
          class="w-full bg-secondary text-on-secondary rounded-full py-3 font-label-md text-label-md hover:bg-on-secondary-container transition-colors mt-2"
        >
          Se connecter
        </button>
        <p
          class="text-center font-body-sm text-body-sm text-on-surface-variant mt-2"
        >
          Pas encore de compte ?
          <a href="register.html" class="text-secondary font-bold"
            >Créer un compte</a
          >
        </p>
      </div>
    </div>
    <script>
      async function doLogin() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPass").value;
        if (!email || !password) {
          Swal.fire({ icon: "warning", text: "Veuillez saisir votre email et votre mot de passe." });
          return;
        }
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (data.success) {
            location.href =
              data.user.role === "admin" ? "admin.html" : "dashboard.html";
          } else {
            Swal.fire({ icon: "error", text: data.message || "Identifiants incorrects." });
          }
        } catch (err) {
          Swal.fire({ icon: "error", text: "Erreur de connexion au serveur." });
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
